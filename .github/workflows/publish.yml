name: Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify immutable release version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node -p 'require("./package.json").version')"
          test "$actual" = "$expected"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify zero runtime dependencies
        run: |
          node -e '
            const pkg = require("./package.json");
            const deps = Object.keys(pkg.dependencies || {});
            if (deps.length > 0) {
              console.error("Runtime dependencies are forbidden for n8n Cloud verified packages:", deps);
              process.exit(1);
            }
          '
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - name: Verify packed tarball and isolated consumer install
        run: |
          mkdir -p /tmp/paymos-package /tmp/paymos-consumer
          npm pack --pack-destination /tmp/paymos-package
          tarball="$(ls /tmp/paymos-package/n8n-nodes-paymos-*.tgz)"
          tar -tzf "$tarball" > /tmp/paymos-package/contents.txt
          grep -q '^package/dist/credentials/PaymosApi.credentials.js$' /tmp/paymos-package/contents.txt
          grep -q '^package/dist/nodes/Paymos/Paymos.node.js$' /tmp/paymos-package/contents.txt
          grep -q '^package/dist/nodes/PaymosTrigger/PaymosTrigger.node.js$' /tmp/paymos-package/contents.txt
          ! grep -q '^package/tests/' /tmp/paymos-package/contents.txt
          ! grep -q '^package/conformance/' /tmp/paymos-package/contents.txt
          cd /tmp/paymos-consumer
          npm init -y >/dev/null
          npm install "$tarball" >/dev/null
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node -e '
            const cred = require("n8n-nodes-paymos/dist/credentials/PaymosApi.credentials.js");
            const node = require("n8n-nodes-paymos/dist/nodes/Paymos/Paymos.node.js");
            const trigger = require("n8n-nodes-paymos/dist/nodes/PaymosTrigger/PaymosTrigger.node.js");
            if (typeof cred.PaymosApi !== "function") process.exit(1);
            if (typeof node.Paymos !== "function") process.exit(1);
            if (typeof trigger.PaymosTrigger !== "function") process.exit(1);
          '
          cd "$GITHUB_WORKSPACE"
      - run: npm publish --access public --provenance
